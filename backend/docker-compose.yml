version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: relocate_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: AdminPassword!1
volumes:
  mongodb_data: